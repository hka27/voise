<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Device Translator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; background: #f5f5f7; color: #1d1d1f; }
        .card { max-width: 400px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background: #0071e3; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 10px; }
        button:active { background: #005bb5; }
        .listening { background: #ff453a !important; }
        .box { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f5f5f7; min-height: 50px; font-size: 18px; text-align: left; word-wrap: break-word; }
        .label { font-size: 12px; color: #86868b; text-transform: uppercase; font-weight: 600; text-align: left; margin-bottom: 5px; }
        #engineStatus { font-size: 13px; color: #00875a; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Native Offline Translator</h1>
    <div id="engineStatus">System Core Ready (100% On-Device)</div>

    <div class="card">
        <button id="actionBtn" onclick="toggleListening()">Start Listening</button>
        
        <div style="margin-top: 25px;">
            <div class="label">Heard Speech (Input)</div>
            <div id="inputBox" class="box">Spoken words will appear here...</div>
        </div>

        <div style="margin-top: 20px;">
            <div class="label">Translated Output (Audio Loopback)</div>
            <div id="outputBox" class="box">Translated text will appear here...</div>
        </div>
    </div>

    <script>
        const engineStatus = document.getElementById('engineStatus');
        const actionBtn = document.getElementById('actionBtn');
        const inputBox = document.getElementById('inputBox');
        const outputBox = document.getElementById('outputBox');
        
        let isListening = false;

        const localDictionary = {
            "hola": "hello",
            "buenos dias": "good morning",
            "donde esta el bano": "where is the bathroom",
            "ayuda": "help",
            "cuanto cuesta": "how much does it cost",
            "gracias": "thank you"
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES'; // Set for Spanish input

            recognition.onstart = () => {
                isListening = true;
                actionBtn.innerText = "Stop Listening";
                actionBtn.classList.add('listening');
                inputBox.innerText = "Listening for speech...";
            };

            recognition.onend = () => {
                isListening = false;
                actionBtn.innerText = "Start Listening";
                actionBtn.classList.remove('listening');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    // 🟢 FIX: Added [0] index to cleanly open Apple's speech transcript slice
                    if (event.results[i] && event.results[i][0]) {
                        const transcriptText = event.results[i][0].transcript;
                        if (event.results[i].isFinal) { 
                            finalTranscript += transcriptText; 
                        } else { 
                            interimTranscript += transcriptText; 
                        }
                    }
                }
                
                // Fallback verification rule to clear any stray undefined bugs
                const displayResult = finalTranscript || interimTranscript;
                inputBox.innerText = displayResult ? displayResult : "Processing audio...";
                
                if (finalTranscript.trim()) {
                    processLocalTranslation(finalTranscript.trim());
                }
            };

            recognition.onerror = (err) => {
                console.error("Speech processing error: ", err.error);
                engineStatus.innerText = "Microphone error. Check permissions.";
            };
        } else {
            engineStatus.innerText = "Compatibility Error: Open via Safari App directly.";
        }

        function toggleListening() {
            if (!recognition) return;
            if (!isListening) { 
                recognition.start(); 
            } else { 
                recognition.stop(); 
            }
        }

        function processLocalTranslation(inputText) {
            let translatedText = "";
            
            const cleanLookupText = inputText.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();

            if (localDictionary[cleanLookupText]) {
                translatedText = localDictionary[cleanLookupText];
                engineStatus.innerText = "Match Found in High-Speed Matrix!";
            } else {
                translatedText = inputText;
                engineStatus.innerText = "System Loopback Processing Mode";
            }

            outputBox.innerText = translatedText;

            const utterance = new SpeechSynthesisUtterance(translatedText);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
