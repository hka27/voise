<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid AI Offline Translator</title>
    
    <!-- 🟢 THIS INJECTS AN ON-SCREEN CONSOLE FOR IPHONE -->
    <script src="https://jsdelivr.net"></script>
    <script>eruda.init();</script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; background: #f5f5f7; color: #1d1d1f; }
        .card { max-width: 400px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background: #0071e3; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 10px; }
        button:active { background: #005bb5; }
        .listening { background: #ff453a !important; }
        .box { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f5f5f7; min-height: 50px; font-size: 18px; text-align: left; }
        .label { font-size: 12px; color: #86868b; text-transform: uppercase; font-weight: 600; text-align: left; margin-bottom: 5px; }
        #engineStatus { font-size: 13px; color: #00875a; margin-top: 10px; font-weight: bold; }
    </style>
    <!-- Transformers CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>Hybrid AI Translator</h1>
    <div id="engineStatus">Initializing Systems...</div>

    <div class="card">
        <button id="actionBtn" onclick="toggleListening()">Start Listening</button>
        
        <div style="margin-top: 25px;">
            <div class="label">Heard Speech (Input)</div>
            <div id="inputBox" class="box">Spoken words will appear here...</div>
        </div>

        <div style="margin-top: 20px;">
            <div class="label">Translated Output (Audio Loopback)</div>
            <div id="outputBox" class="box">Translated text will appear here...</div>
        </div>
    </div>

    <script>
        const engineStatus = document.getElementById('engineStatus');
        const actionBtn = document.getElementById('actionBtn');
        const inputBox = document.getElementById('inputBox');
        const outputBox = document.getElementById('outputBox');
        
        let translatorModel = null;
        let isListening = false;

        const localDictionary = {
            "hola": "hello",
            "buenos dias": "good morning",
            "donde esta el bano": "where is the bathroom",
            "ayuda": "help",
            "cuanto cuesta": "how much does it cost",
            "gracias": "thank you"
        };

        async function initNeuralEngine() {
            engineStatus.innerText = "Downloading Local Neural Model (~40MB)... Please wait.";
            try {
                // Check if the script loaded properly into the global browser scope
                if (typeof transformers === 'undefined') {
                    throw new Error("Transformers CDN script failed to parse or load.");
                }
                translatorModel = await transformers.pipeline('translation', 'Xenova/opus-mt-es-en'); 
                engineStatus.innerText = "Neural AI Model Ready Offline!";
            } catch (error) {
                console.error("Neural initialization failed:", error);
                engineStatus.innerText = "Neural Error. Using Dictionary Mode Only.";
            }
        }

        window.addEventListener('load', initNeuralEngine);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'es-ES';

        function toggleListening() {
            if (!isListening) { recognition.start(); } else { recognition.stop(); }
        }

        recognition.onstart = () => {
            isListening = true;
            actionBtn.innerText = "Stop Listening";
            actionBtn.classList.add('listening');
            inputBox.innerText = "Listening for speech...";
        };

        recognition.onend = () => {
            isListening = false;
            actionBtn.innerText = "Start Listening";
            actionBtn.classList.remove('listening');
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) { finalTranscript += event.results[i].transcript; }
                else { interimTranscript += event.results[i].transcript; }
            }
            inputBox.innerText = finalTranscript || interimTranscript;
            
            if (finalTranscript) {
                processHybridTranslation(finalTranscript.trim());
            }
        };

        async function processHybridTranslation(inputText) {
            let translatedText = "";
            const cleanLookupText = inputText.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();

            if (localDictionary[cleanLookupText]) {
                translatedText = localDictionary[cleanLookupText];
                engineStatus.innerText = "Translated via High-Speed Dictionary Matrix!";
            } else if (translatorModel) {
                engineStatus.innerText = "Processing via Local Neural Network...";
                try {
                    const output = await translatorModel(inputText);
                    if (output && output[0] && output[0].translation_text) {
                        translatedText = output[0].translation_text;
                    } else {
                        translatedText = "[Error processing translation payload]";
                    }
                } catch (err) {
                    console.error("AI inference error: ", err);
                    translatedText = "[AI processing failed]";
                }
                engineStatus.innerText = "Neural AI Model Ready Offline!";
            } else {
                translatedText = "System processing... Please wait.";
            }

            outputBox.innerText = translatedText;

            const utterance = new SpeechSynthesisUtterance(translatedText);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
