<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid AI Offline Translator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; background: #f5f5f7; color: #1d1d1f; }
        .card { max-width: 400px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        button { background: #0071e3; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 10px; }
        button:active { background: #005bb5; }
        .listening { background: #ff453a !important; }
        .box { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f5f5f7; min-height: 50px; font-size: 18px; text-align: left; word-wrap: break-word; }
        .label { font-size: 12px; color: #86868b; text-transform: uppercase; font-weight: 600; text-align: left; margin-bottom: 5px; }
        #engineStatus { font-size: 13px; color: #ff9500; margin-top: 10px; font-weight: bold; }
    </style>
    
    <!-- 🟢 FIX: Load the stable production global bundle instead of a raw module script -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <h1>Hybrid AI Translator</h1>
    <div id="engineStatus">Booting Core Memory Modules...</div>

    <div class="card">
        <button id="actionBtn" onclick="toggleListening()">Start Listening</button>
        
        <div style="margin-top: 25px;">
            <div class="label">Heard Speech (Input)</div>
            <div id="inputBox" class="box">Spoken words will appear here...</div>
        </div>

        <div style="margin-top: 20px;">
            <div class="label">Translated Output (Audio Loopback)</div>
            <div id="outputBox" class="box">Translated text will appear here...</div>
        </div>
    </div>

    <script>
        const engineStatus = document.getElementById('engineStatus');
        const actionBtn = document.getElementById('actionBtn');
        const inputBox = document.getElementById('inputBox');
        const outputBox = document.getElementById('outputBox');
        
        let translatorModel = null;
        let isListening = false;

        const localDictionary = {
            "hola": "hello",
            "buenos dias": "good morning",
            "donde esta el bano": "where is the bathroom",
            "ayuda": "help",
            "cuanto cuesta": "how much does it cost",
            "gracias": "thank you"
        };

        async function loadNeuralNetwork() {
            // Check if the global bundle from the script tag is available
            const hf = window.transformers;
            if (!hf) {
                setTimeout(loadNeuralNetwork, 500); 
                return;
            }

            engineStatus.innerText = "Downloading Local AI Engine (~40MB)... Stay on page.";
            try {
                // 🟢 FIX: Explicitly disable WebGPU and multithreaded WASM pools to prevent iOS Safari from crashing/stalling
                hf.env.backends.onnx.wasm.numThreads = 1;
                hf.env.allowLocalModels = false;

                // Load the translation network onto the safe, stable CPU execution loop
                translatorModel = await hf.pipeline('translation', 'Xenova/opus-mt-es-en', {
                    device: 'wasm'
                });

                engineStatus.innerText = "Neural AI Model Ready 100% Offline!";
                engineStatus.style.color = "#00875a";
            } catch (err) {
                console.error("AI Allocation Interrupted: ", err);
                engineStatus.innerText = "Offline Engine Error. Using Dictionary Mode.";
                engineStatus.style.color = "#ff3b30";
            }
        }

        window.addEventListener('load', () => {
            setTimeout(loadNeuralNetwork, 1000);
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                isListening = true;
                actionBtn.innerText = "Stop Listening";
                actionBtn.classList.add('listening');
                inputBox.innerText = "Listening for speech...";
            };

            recognition.onend = () => {
                isListening = false;
                actionBtn.innerText = "Start Listening";
                actionBtn.classList.remove('listening');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i] && event.results[i][0]) {
                        const transcriptText = event.results[i][0].transcript;
                        if (event.results[i].isFinal) { finalTranscript += transcriptText; }
                        else { interimTranscript += transcriptText; }
                    }
                }
                
                inputBox.innerText = finalTranscript || interimTranscript;
                
                if (finalTranscript.trim()) {
                    processHybridEngine(finalTranscript.trim());
                }
            };
        }

        function toggleListening() {
            if (!recognition) return;
            if (!isListening) { recognition.start(); } else { recognition.stop(); }
        }

        async function processHybridEngine(inputText) {
            let translatedText = "";
            const cleanLookupText = inputText.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();

            if (localDictionary[cleanLookupText]) {
                translatedText = localDictionary[cleanLookupText];
                engineStatus.innerText = "Instant Dictionary Match!";
            } else if (translatorModel) {
                engineStatus.innerText = "Computing Neural Matrices on CPU...";
                try {
                    const output = await translatorModel(inputText);
                    if (output && output[0] && output[0].translation_text) {
                        translatedText = output[0].translation_text;
                    } else {
                        translatedText = "[Data translation payload missing format]";
                    }
                } catch (aiErr) {
                    console.error("Inference structural crash: ", aiErr);
                    translatedText = "[Local AI Processing Crash]";
                }
                engineStatus.innerText = "Neural AI Model Ready 100% Offline!";
            } else {
                translatedText = "[AI Engine Loading... Use simple dictionary phrases]";
            }

            outputBox.innerText = translatedText;

            const utterance = new SpeechSynthesisUtterance(translatedText);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
